{% extends "tracker/base.html" %}

{% block title %}Sign In — Habit{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 72vh; padding: 20px 0;">
  <div class="ios-card" style="width: 100%; max-width: 380px; padding: 40px 32px; text-align: center;">
    
    <!-- Minimalist Brand Monogram -->
    <div style="width: 48px; height: 48px; border-radius: 12px; background: var(--text-primary); color: var(--bg-canvas); margin: 0 auto 20px auto; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; letter-spacing: -0.04em;">
      H
    </div>

    <h1 style="font-size: 22px; font-weight: 700; letter-spacing: -0.024em; margin-bottom: 4px;">Sign In</h1>
    <p style="font-size: 13.5px; color: var(--text-secondary); margin-bottom: 28px;">
      Continue to your daily habit timeline.
    </p>

    <!-- Sign In Form -->
    <form method="POST" action="{% url 'login' %}" style="text-align: left;">
      {% csrf_token %}
      
      <div class="ios-form-group">
        <label class="ios-label">Username</label>
        <input type="text" name="username" class="ios-input" placeholder="Username" required autofocus>
      </div>

      <div class="ios-form-group" style="margin-bottom: 24px;">
        <label class="ios-label">Password</label>
        <input type="password" name="password" class="ios-input" placeholder="Password" required>
      </div>

      <button type="submit" class="ios-btn-primary" style="width: 100%; height: 44px; font-size: 14.5px; margin-bottom: 16px;">
        Sign In
      </button>
    </form>

    <div style="border-top: 1px solid var(--border-hairline); padding-top: 18px; font-size: 13px; color: var(--text-secondary);">
      New to Habit? 
      <a href="{% url 'register' %}" style="color: var(--apple-blue); font-weight: 500; text-decoration: none;">
        Create an account
      </a>
    </div>

  </div>
</div>
{% endblock %}
